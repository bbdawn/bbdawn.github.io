<script>
/* ============================================================
   CONFIG
   watchlist / stocks / fear-greed 데이터는 GitHub Actions가
   assets/data/*.json 으로 30분마다 커밋하고, 이 페이지는
   raw.githubusercontent.com 에서 그 파일을 읽어와 표시만 한다.
   (관심종목 구성은 저장소의 assets/data/watchlist.json 파일을
   직접 수정해서 관리한다.)
   ============================================================ */
var REPO     = 'bbdawn/bbdawn.github.io';
var RAW_BASE = 'https://raw.githubusercontent.com/' + REPO + '/main/assets/data/';
var WL_CACHE_KEY = 'bbdawn-watchlist-cache';

var watchlist  = [];
var quotesData = { updatedAt: null, quotes: {} };

/* ============================================================
   HELPERS
   ============================================================ */
function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function timeAgo(iso){
  if(!iso) return '-';
  var diffMs = Date.now() - new Date(iso).getTime();
  var min = Math.floor(diffMs/60000);
  if(min < 1) return '방금 전';
  if(min < 60) return min+'분 전';
  var hr = Math.floor(min/60);
  if(hr < 24) return hr+'시간 전';
  return Math.floor(hr/24)+'일 전';
}
function fmtCurrency(n, currency){
  if(n==null || isNaN(n)) return '-';
  if(currency === 'KRW') return Math.round(n).toLocaleString('ko-KR')+'원';
  return '$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
}

/* ============================================================
   WATCHLIST (읽기 전용 표시)
   ============================================================ */
function loadWatchlistLocal(){ try{ return JSON.parse(localStorage.getItem(WL_CACHE_KEY)||'null'); }catch(e){ return null; } }
function saveWatchlistLocal(arr){ localStorage.setItem(WL_CACHE_KEY, JSON.stringify(arr)); }

var MEMO_KEY = 'bbdawn-stock-memo';
function loadMemos(){ try{ return JSON.parse(localStorage.getItem(MEMO_KEY)||'{}'); }catch(e){ return {}; } }
function saveMemo(symbol, text){
  var memos = loadMemos();
  if(text) memos[symbol] = text; else delete memos[symbol];
  localStorage.setItem(MEMO_KEY, JSON.stringify(memos));
}

function computeChange(q){
  var change = q.price - q.previousClose;
  var pct = q.previousClose ? (change/q.previousClose*100) : 0;
  return { change: change, pct: pct, up: change > 0.0000001, down: change < -0.0000001 };
}

function buildSparkSvg(history, colorClass){
  if(!history || history.length < 2) return '';
  var w=200, h=34, pad=2;
  var ys = history.map(function(p){ return p.y; });
  var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
  var range = (maxY - minY) || 1;
  function px(i){ return pad + (w-2*pad) * (i/(history.length-1)); }
  function py(y){ return h-pad - (h-2*pad) * ((y-minY)/range); }
  var pts = history.map(function(p,i){ return px(i).toFixed(1)+','+py(p.y).toFixed(1); }).join(' ');
  return '<svg viewBox="0 0 '+w+' '+h+'" class="stock-spark-svg" preserveAspectRatio="none">'+
    '<polyline points="'+pts+'" class="stock-spark-line '+colorClass+'" style="stroke:currentColor"/>'+
    '</svg>';
}

function buildRangeBar(q){
  if(q.fiftyTwoWeekLow==null || q.fiftyTwoWeekHigh==null || q.fiftyTwoWeekHigh<=q.fiftyTwoWeekLow) return '';
  var pct = (q.price - q.fiftyTwoWeekLow) / (q.fiftyTwoWeekHigh - q.fiftyTwoWeekLow) * 100;
  pct = Math.max(0, Math.min(100, pct));
  return '<div class="stock-range">'+
    '<div class="stock-range-track"><div class="stock-range-dot" style="left:'+pct.toFixed(1)+'%"></div></div>'+
    '<div class="stock-range-labels"><span>52주 최저 '+fmtCurrency(q.fiftyTwoWeekLow,q.currency)+'</span>'+
    '<span>52주 최고 '+fmtCurrency(q.fiftyTwoWeekHigh,q.currency)+'</span></div>'+
    '</div>';
}

function buildMemoField(symbol){
  var memos = loadMemos();
  var val = escHtml(memos[symbol]||'');
  return '<div class="stock-memo-wrap">'+
    '<input type="text" class="stock-memo-input" placeholder="메모 (이 브라우저에만 저장, 비공개)" '+
    'value="'+val+'" data-symbol="'+escHtml(symbol)+'">'+
    '</div>';
}

function renderStockItem(w, q, moverBadge){
  var item = document.createElement('div');
  item.className = 'stock-item' + (moverBadge ? ' stock-top-mover' : '');
  var body = '';
  if(moverBadge){
    body += '<span class="stock-mover-badge '+moverBadge.cls+'">'+moverBadge.label+'</span>';
  }
  if(q && q.price!=null){
    var c = computeChange(q);
    var cls = c.up?'stock-up':(c.down?'stock-down':'stock-flat');
    var sign = c.up?'+':'';
    body +=
      '<div class="stock-main">'+
        '<div class="stock-name">'+escHtml(w.name||q.name||w.symbol)+'<span class="stock-symbol">'+escHtml(w.symbol)+'</span></div>'+
        '<div class="stock-price '+cls+'">'+fmtCurrency(q.price,q.currency)+'</div>'+
      '</div>'+
      '<div class="stock-sub">'+
        '<span class="'+cls+'"><i class="fas fa-caret-'+(c.up?'up':(c.down?'down':'right'))+' me-1"></i>'+
        sign+fmtCurrency(c.change,q.currency)+' ('+sign+c.pct.toFixed(2)+'%)</span>'+
        '<span class="text-muted small ms-2">'+timeAgo(quotesData.updatedAt)+'</span>'+
      '</div>'+
      buildSparkSvg(q.history, cls)+
      buildRangeBar(q);
  } else {
    body +=
      '<div class="stock-main">'+
        '<div class="stock-name">'+escHtml(w.name||w.symbol)+'<span class="stock-symbol">'+escHtml(w.symbol)+'</span></div>'+
        '<div class="stock-price text-muted">-</div>'+
      '</div>'+
      '<div class="stock-sub"><span class="text-muted small">가격 정보 대기 중 (최대 30분)</span></div>';
  }
  body += buildMemoField(w.symbol);
  item.innerHTML = body;
  var memoInput = item.querySelector('.stock-memo-input');
  memoInput.addEventListener('change', function(){ saveMemo(w.symbol, memoInput.value.trim()); });
  return item;
}

function computeTopMovers(){
  var withChange = watchlist.map(function(w){
    var q = quotesData.quotes[w.symbol];
    if(!q || q.price==null || !q.previousClose) return null;
    var c = computeChange(q);
    return { w: w, q: q, pct: c.pct };
  }).filter(Boolean);
  if(!withChange.length) return { gainer:null, loser:null };
  var sorted = withChange.slice().sort(function(a,b){ return b.pct - a.pct; });
  return { gainer: sorted[0], loser: sorted[sorted.length-1] };
}

function renderSummary(){
  var banner = document.getElementById('summary-banner');
  var movers = computeTopMovers();
  if(!movers.gainer && !movers.loser){ banner.style.display='none'; return; }
  var parts = [];
  if(movers.gainer && movers.gainer.pct > 0){
    parts.push('오늘 가장 많이 오른 종목은 <b>'+escHtml(movers.gainer.w.name||movers.gainer.w.symbol)+'</b>(+'+movers.gainer.pct.toFixed(2)+'%)');
  }
  if(movers.loser && movers.loser.pct < 0){
    parts.push('가장 많이 내린 종목은 <b>'+escHtml(movers.loser.w.name||movers.loser.w.symbol)+'</b>('+movers.loser.pct.toFixed(2)+'%)');
  }
  if(!parts.length){ banner.style.display='none'; return; }
  document.getElementById('summary-text').innerHTML = parts.join(', ')+'입니다.';
  banner.style.display = 'flex';
}

function renderWatchlist(){
  var groups = { KR: document.getElementById('wl-kr'), US: document.getElementById('wl-us'), IDX: document.getElementById('wl-idx') };
  var emptyLabel = { KR:'등록된 국내 종목이 없습니다.', US:'등록된 해외 종목이 없습니다.', IDX:'등록된 지표가 없습니다.' };
  Object.keys(groups).forEach(function(k){ groups[k].innerHTML=''; });
  if(!watchlist.length){
    Object.keys(groups).forEach(function(k){
      groups[k].innerHTML = '<div class="text-muted small py-3 text-center">'+emptyLabel[k]+'</div>';
    });
    return;
  }
  var movers = computeTopMovers();
  var any = { KR:false, US:false, IDX:false };
  watchlist.forEach(function(w){
    var key = groups[w.market] ? w.market : 'US';
    any[key] = true;
    var q = quotesData.quotes[w.symbol];
    var badge = null;
    if(movers.gainer && movers.gainer.w.symbol===w.symbol && movers.gainer.pct>0) badge = { cls:'up-badge', label:'최고 상승' };
    if(movers.loser && movers.loser.w.symbol===w.symbol && movers.loser.pct<0) badge = { cls:'down-badge', label:'최고 하락' };
    groups[key].appendChild(renderStockItem(w, q, badge));
  });
  Object.keys(groups).forEach(function(k){
    if(!any[k]) groups[k].innerHTML = '<div class="text-muted small py-3 text-center">'+emptyLabel[k]+'</div>';
  });
  renderSummary();
}

/* ============================================================
   FEAR & GREED GAUGE
   ============================================================ */
var FNG_LABELS = {
  'extreme fear':'극단적 공포', 'fear':'공포', 'neutral':'중립', 'greed':'탐욕', 'extreme greed':'극단적 탐욕'
};
var FNG_COLORS = {
  'extreme fear':'#e64545', 'fear':'#f2994a', 'neutral':'#c9b458', 'greed':'#8bc34a', 'extreme greed':'#2e7d32'
};
var FNG_COMPONENT_LABELS = {
  market_momentum_sp500:'S&amp;P500 모멘텀', stock_price_strength:'주가 강도', stock_price_breadth:'주가 폭',
  put_call_options:'풋/콜 옵션', market_volatility_vix:'변동성(VIX)',
  junk_bond_demand:'정크본드 수요', safe_haven_demand:'안전자산 수요'
};
function ratingColor(rating){ return FNG_COLORS[rating] || '#999'; }
function ratingLabel(rating){ return FNG_LABELS[rating] || rating || '-'; }

function fngPolar(cx,cy,r,scoreDeg){
  var rad = scoreDeg*Math.PI/180;
  return { x: cx - r*Math.cos(rad), y: cy - r*Math.sin(rad) };
}
function fngArcPath(cx,cy,r,s1,s2){
  var a1 = s1/100*180, a2 = s2/100*180;
  var p1 = fngPolar(cx,cy,r,a1), p2 = fngPolar(cx,cy,r,a2);
  var large = (a2-a1) > 180 ? 1 : 0;
  return 'M '+p1.x.toFixed(2)+' '+p1.y.toFixed(2)+' A '+r+' '+r+' 0 '+large+' 1 '+p2.x.toFixed(2)+' '+p2.y.toFixed(2);
}
function renderGauge(score){
  var cx=100, cy=100, r=82;
  var bands = [[0,25,'#e64545'],[25,45,'#f2994a'],[45,55,'#c9b458'],[55,75,'#8bc34a'],[75,100,'#2e7d32']];
  var svg = document.getElementById('fng-gauge-arcs');
  svg.innerHTML = bands.map(function(b){
    return '<path d="'+fngArcPath(cx,cy,r,b[0],b[1])+'" stroke="'+b[2]+'" stroke-width="16" fill="none" stroke-linecap="butt"/>';
  }).join('');
  var s = Math.max(0, Math.min(100, score||0));
  var tip = fngPolar(cx,cy,66, s/100*180);
  document.getElementById('fng-needle').setAttribute('x2', tip.x.toFixed(2));
  document.getElementById('fng-needle').setAttribute('y2', tip.y.toFixed(2));
}
function renderSparkline(hist){
  var wrap = document.getElementById('fng-history');
  if(!hist || !hist.length){ wrap.innerHTML=''; return; }
  var w=600, h=90, pad=6;
  var xs = hist.map(function(p){ return p.x; });
  var minX = Math.min.apply(null,xs), maxX = Math.max.apply(null,xs);
  function px(x){ return pad + (w-2*pad) * ((x-minX)/((maxX-minX)||1)); }
  function py(y){ return h-pad - (h-2*pad) * (Math.max(0,Math.min(100,y))/100); }
  var pts = hist.map(function(p){ return px(p.x).toFixed(1)+','+py(p.y).toFixed(1); }).join(' ');
  var gridYs = [25,45,55,75].map(function(v){ return py(v).toFixed(1); });
  wrap.innerHTML =
    '<svg viewBox="0 0 '+w+' '+h+'" class="fng-history-svg" preserveAspectRatio="none">'+
    gridYs.map(function(y){ return '<line x1="0" x2="'+w+'" y1="'+y+'" y2="'+y+'" class="fng-grid"/>'; }).join('')+
    '<polyline points="'+pts+'" class="fng-history-line"/>'+
    '</svg>';
}
function renderComponents(components){
  var wrap = document.getElementById('fng-components'); wrap.innerHTML='';
  Object.keys(FNG_COMPONENT_LABELS).forEach(function(key){
    var c = components && components[key]; if(!c || c.score==null) return;
    var color = ratingColor(c.rating);
    var row = document.createElement('div'); row.className='fng-comp-row';
    row.innerHTML =
      '<span class="fng-comp-label">'+FNG_COMPONENT_LABELS[key]+'</span>'+
      '<span class="fng-comp-bar"><span class="fng-comp-fill" style="width:'+Math.max(0,Math.min(100,c.score))+'%;background:'+color+'"></span></span>'+
      '<span class="fng-comp-score" style="color:'+color+'">'+Math.round(c.score)+'</span>';
    wrap.appendChild(row);
  });
}
function renderFearGreed(data){
  document.getElementById('fng-error').textContent = '';
  document.getElementById('fng-score').textContent = data.score!=null ? Math.round(data.score) : '-';
  var lbl = document.getElementById('fng-rating');
  lbl.textContent = ratingLabel(data.rating);
  lbl.style.color = ratingColor(data.rating);
  renderGauge(data.score);
  renderSparkline(data.historical);
  renderComponents(data.components);
  var items = [
    ['어제', data.previousClose], ['1주일 전', data.previousWeek],
    ['1개월 전', data.previousMonth], ['1년 전', data.previousYear]
  ];
  document.getElementById('fng-compare').innerHTML = items.map(function(it){
    return '<div class="fng-compare-item"><span class="fng-compare-label">'+it[0]+'</span>'+
      '<span class="fng-compare-val">'+(it[1]!=null?Math.round(it[1]):'-')+'</span></div>';
  }).join('');
  document.getElementById('fng-updated').textContent = data.updatedAt ? ('갱신: '+timeAgo(data.updatedAt)) : '';
}

/* ============================================================
   DATA LOAD
   ============================================================ */
async function fetchRaw(name){
  var res = await fetch(RAW_BASE + name + '?t=' + Date.now(), { cache: 'no-store' });
  if(!res.ok) throw new Error(name + ' 조회 실패 ('+res.status+')');
  return res.json();
}
async function loadAll(){
  try{
    watchlist = await fetchRaw('watchlist.json');
    saveWatchlistLocal(watchlist);
  }catch(e){
    watchlist = loadWatchlistLocal() || [];
  }
  renderWatchlist();

  try{
    quotesData = await fetchRaw('stocks.json');
  }catch(e){
    quotesData = { updatedAt:null, quotes:{} };
  }
  renderWatchlist();
  document.getElementById('stocks-updated').textContent =
    quotesData.updatedAt ? ('갱신: '+timeAgo(quotesData.updatedAt)) : '데이터 없음';

  try{
    var fng = await fetchRaw('fear-greed.json');
    renderFearGreed(fng);
  }catch(e){
    document.getElementById('fng-error').textContent = '공포탐욕지수 데이터를 불러올 수 없습니다: '+e.message;
  }
}

/* ============================================================
   INIT
   ============================================================ */
document.addEventListener('DOMContentLoaded', function(){
  loadAll();
});
</script>
